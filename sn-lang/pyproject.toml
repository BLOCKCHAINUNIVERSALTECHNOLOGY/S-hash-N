[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sn-lang"
version = "1.3.0"
description = "S#N - a small, readable programming language for AI, ML and data work (English and Hindi keywords)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["programming-language", "interpreter", "machine-learning", "data", "hindi"]

[project.scripts]
sn = "sn.cli:entry"

[tool.setuptools]
packages = ["sn"]
